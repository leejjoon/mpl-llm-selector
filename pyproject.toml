[project]
name = "mpl-llm-selector"
version = "0.1.0"
description = ""
authors = [
    {name = "Jae-Joon Lee",email = "lee.j.joon@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "pydantic-ai (>=0.4.0,<0.5.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "numpy (>=2.3.1,<3.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "tabulate (>=0.9.0,<0.10.0)"
]


[tool.poetry]
packages = [{include = "mpl_llm_selector"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test.dependencies]
seaborn = "^0.13.2"
pytest = "^8.4.1"

